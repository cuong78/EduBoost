spring.application.name=eduBoostBackend

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.main.allow-circular-references=true
spring.datasource.driver-class-name= org.postgresql.Driver
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION_MS}
jwt.refresh.expiration.ms=${JWT_REFRESH_EXPIRATION_MS}

# Email Configuration
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}



# Backend URLs
backend.url.base=${BACKEND_URL_BASE:http://localhost:8080}

# Frontend URLs
frontend.url.base=${FRONTEND_URL_BASE}
frontend.url.payment.return=${FRONTEND_URL_PAYMENT_RETURN}
frontend.url.email.verification=${FRONTEND_URL_EMAIL_VERIFICATION}
frontend.url.student.login=${FRONTEND_URL_STUDENT_LOGIN:${FRONTEND_URL_BASE}/login}
frontend.url.parent.login=${FRONTEND_URL_PARENT_LOGIN:${FRONTEND_URL_BASE}/parent/login}
frontend.url.auto.login.callback=${FRONTEND_URL_AUTO_LOGIN_CALLBACK:${FRONTEND_URL_BASE}/login}

# VNPay Payment Configuration
payment.vnpay.tmn-code=${PAYMENT_VNPAY_TMN_CODE}
payment.vnpay.secret-key=${PAYMENT_VNPAY_SECRET_KEY}
payment.vnpay.url=${PAYMENT_VNPAY_URL}
payment.vnpay.ip-address=${PAYMENT_VNPAY_IP_ADDRESS}
payment.vnpay.wallet-return-url=${PAYMENT_VNPAY_WALLET_RETURN_URL}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE}

# File Upload Configuration
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# MinIO Configuration
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin123}
minio.bucket-name=${MINIO_BUCKET_NAME:eduboost-resources}



ai.deepseek.api-key=${AI_DEEPSEEK_API_KEY:}
ai.deepseek.model=${AI_DEEPSEEK_MODEL:deepseek-chat}